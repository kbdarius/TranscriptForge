constraints_and_known_issues:
  - description: "Whisper transcription uses a model already present in the local cache; model download is a separate action."
    status: "confirmed"
    affected_areas:
      - "transcriptforge/models_cache.py"
      - "transcriptforge/app.py"
      - "transcriptforge/cli.py"
    workaround: "Download the selected model with the GUI or CLI before transcribing."
    evidence:
      - "README.md"
      - "DOC/INSTALLATION.md"
  - description: "Outlook meeting lookup uses the installed Outlook Classic COM interface and the default local calendar; it is not an Outlook web or Microsoft Graph integration."
    status: "confirmed"
    affected_areas:
      - "transcriptforge/outlook_calendar.py"
    workaround: "Use the no-meeting option or existing speaker preferences when local Outlook Classic is unavailable."
    evidence:
      - "transcriptforge/outlook_calendar.py"
      - "tests/test_outlook_calendar.py"
      - "README.md"
  - description: "Invitee names narrow matches to known profiles but do not provide voice identity for a person without a saved, user-confirmed profile."
    status: "confirmed"
    affected_areas:
      - "transcriptforge/speakers.py"
      - "transcriptforge/controller.py"
      - "DOC/SPEAKER_RECOGNITION_CURRENT_STATE.md"
    workaround: "Keep unmatched guests and uncertain clusters available for user review."
    evidence:
      - "README.md"
      - "DOC/SPEAKER_RECOGNITION_CURRENT_STATE.md"
  - description: "The meeting invitee count is a soft review priority. It does not merge or discard distinct voice groups."
    status: "confirmed"
    affected_areas:
      - "transcriptforge/app.py"
      - "transcriptforge/speakers.py"
      - "transcriptforge/controller.py"
    workaround: "Review extra groups in the additional-voices section."
    evidence:
      - "README.md"
      - "tests/test_app_meeting.py"
      - "tests/test_speakers.py"
  - description: "Formal held-out evaluation and finer overlap detection remain follow-up work; speaker-recognition quality is not claimed to be fully validated for all meeting types."
    status: "planned"
    affected_areas:
      - "transcriptforge/speakers.py"
      - "DOC/SPEAKER_RECOGNITION_CURRENT_STATE.md"
      - "DOC/SPEAKER_RECOGNITION_FEASIBILITY_PLAN.md"
    workaround: "Keep uncertain results reviewable and evaluate recognition on held-out recordings before claiming broader accuracy."
    evidence:
      - "DOC/SPEAKER_RECOGNITION_CURRENT_STATE.md"
      - "DOC/SPEAKER_RECOGNITION_FEASIBILITY_PLAN.md"
  - description: "Speaker profiles and portable configuration packages can contain sensitive biometric voice embeddings and names."
    status: "confirmed"
    affected_areas:
      - "transcriptforge/speakers.py"
      - "transcriptforge/configuration.py"
      - "transcriptforge/settings.py"
    workaround: "Keep profiles and .tfconfig packages local or transfer them only through an approved private channel; do not commit generated profile data."
    evidence:
      - "README.md"
      - "DOC/INSTALLATION.md"
      - ".gitignore"
  - description: "The default recording-folder path in the GUI is machine-specific and may not exist on another PC."
    status: "confirmed"
    affected_areas:
      - "transcriptforge/app.py"
      - "transcriptforge/settings.py"
    workaround: "Choose a valid local recording folder in the GUI; saved folder settings are per PC."
    evidence:
      - "README.md"
      - "transcriptforge/app.py"
      - "transcriptforge/settings.py"

