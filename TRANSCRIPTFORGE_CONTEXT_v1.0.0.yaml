code_profile:
  languages_and_toolchains:
    - "Python 3.11 or newer is specified by the Windows installation guide."
    - "Windows batch and PowerShell scripts support installation, launch, and optional scheduled scanning."
    - "Tkinter is the desktop UI toolkit; the test suite uses Python unittest."
  architecture:
    - "A Tkinter desktop GUI and automation-oriented CLI call shared local processing and persistence modules."
    - "transcriptforge/controller.py coordinates a background transcription job and GUI review checkpoints."
    - "Media decoding, local Whisper transcription, optional speaker analysis, profile storage, and Markdown output are split into focused package modules."
  entry_points:
    - "py -3 -m transcriptforge launches the GUI or handles the scheduled-scan switch."
    - "py -3 -m transcriptforge.cli invokes command-line transcription and management commands."
    - "Run_TranscriptForge.bat launches the desktop application on Windows."
    - "Setup_TranscriptForge.bat installs dependencies and initializes model files."
    - "Install_TranscriptForgeTask.ps1 registers the optional recurring Windows Task Scheduler job."
  interfaces:
    - "Local input media extensions are defined in transcriptforge/media.py: WAV, MP3, M4A, AAC, MP4, MOV, and MKV."
    - "The main transcript interface is a timestamped Markdown file."
    - "CLI speaker review uses a JSON file and an explicit rerun handoff."
    - "Optional calendar data is read through the local Outlook Classic COM interface."
  data_models_and_persistence:
    - "transcriptforge/models.py defines transcript segments, processing statistics, results, and suspect ranges."
    - "Application settings and histories are JSON files under %LOCALAPPDATA%\\LocalAudioTranscriber when LOCALAPPDATA is available."
    - "speaker-profiles.json stores confirmed speaker names and voice embeddings; the current speaker-recognition report describes schema 3 and its archive/active-set model."
    - "Portable .tfconfig packages are ZIP archives containing selected preferences, templates, speaker profiles, and sample rejection decisions."
    - "Whisper model files are cached under %LOCALAPPDATA%\\LocalAudioTranscriber\\whisper-models by default."
  critical_logic:
    - "transcriptforge/media.py:decode_to_wav converts supported inputs to temporary mono 16 kHz PCM."
    - "transcriptforge/transcription.py:transcribe_samples runs local Whisper in windows and retries suspect ranges."
    - "transcriptforge/quality.py identifies weak or suspicious repeated output ranges."
    - "transcriptforge/speakers.py implements voice analysis, profile matching, clustering, review, and profile learning."
    - "transcriptforge/outlook_calendar.py:meetings_on reads appointments from the local default calendar."
