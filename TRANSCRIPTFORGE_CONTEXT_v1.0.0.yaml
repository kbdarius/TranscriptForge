scope:
  purpose:
    - "Provide a compact, source-grounded navigation map for future development and maintenance work."
    - "Identify authoritative implementation, documentation, workflows, local data boundaries, and known limitations."
  in_scope:
    - "Tracked application source, tests, setup and scheduling scripts, and project documentation."
    - "Current user-facing transcription, meeting-aware speaker review, configuration, and scheduled-scan workflows."
  out_of_scope:
    - "The contents of user recordings, transcripts, voice profiles, model files, temporary audio, or private configuration packages."
    - "Live Outlook calendar contents and machine-specific local settings."
    - "Unreviewed untracked image contents and external systems not represented by repository evidence."

project_overview:
  purpose: "Transcribe local audio and video recordings into timestamped Markdown files, with optional local speaker recognition and human review."
  audience_or_stakeholders:
    - "Windows users who transcribe local recordings, including meeting recordings."
    - "Project maintainers who develop, test, install, or support the application."
  primary_outputs:
    - "A Markdown transcript with source, model, language, duration, and timestamped transcript segments."
    - "Optional speaker-review JSON for the CLI human-review handoff."
    - "Optional local speaker-profile and settings data."

project_components:
  - name: "Desktop GUI"
    path: "transcriptforge/app.py"
    purpose: "Provides the Tkinter transcription, setup, speaker-review, Outlook meeting, history, and profile-management workflows."
    critical: true
    authoritative_sources:
      - "transcriptforge/app.py"
      - "transcriptforge/controller.py"
    supporting_sources:
      - "README.md"
      - "tests/test_app_meeting.py"
    dependencies:
      - "TranscriptionController"
      - "Local settings and speaker-profile stores"
      - "Optional Outlook Classic calendar integration"
    constraints:
      - "The application is Windows-first and uses the standard-library Tkinter UI."
      - "The window title reads its version from transcriptforge/version.py."

  - name: "Transcription controller and media pipeline"
    path: "transcriptforge/controller.py"
    purpose: "Coordinates media decoding, local speaker analysis and review, Whisper transcription, output writing, cancellation, and progress events."
    critical: true
    authoritative_sources:
      - "transcriptforge/controller.py"
      - "transcriptforge/media.py"
      - "transcriptforge/audio.py"
      - "transcriptforge/transcription.py"
      - "transcriptforge/quality.py"
      - "transcriptforge/output.py"
    supporting_sources:
      - "tests/test_transcription.py"
      - "tests/test_output.py"
      - "DOC/INSTALLATION.md"
    dependencies:
      - "imageio-ffmpeg"
      - "openai-whisper"
      - "NumPy"
    constraints:
      - "Media decoding and transcription run locally after the required packages and models are installed."
      - "Temporary decoded audio is managed in temporary working directories."

  - name: "Speaker recognition and meeting context"
    path: "transcriptforge/speakers.py"
    purpose: "Creates voice embeddings and clusters, matches reviewed voices to local profiles, applies roster filtering, and supports confirmed name reconciliation."
    critical: true
    authoritative_sources:
      - "transcriptforge/speakers.py"
      - "transcriptforge/speaker_names.py"
      - "transcriptforge/outlook_calendar.py"
      - "transcriptforge/controller.py"
    supporting_sources:
      - "DOC/SPEAKER_RECOGNITION_CURRENT_STATE.md"
      - "tests/test_speakers.py"
      - "tests/test_speaker_names.py"
      - "tests/test_outlook_calendar.py"
    dependencies:
      - "Resemblyzer"
      - "Optional Outlook Classic COM access through pywin32"
    constraints:
      - "Speaker profiles contain sensitive voice embeddings and names."
      - "Meeting invitee names narrow profile matching but do not identify an unprofiled voice by themselves."

  - name: "CLI and scheduled recording scan"
    path: "transcriptforge/cli.py"
    purpose: "Provides command-line transcription, model/profile/configuration commands, JSON event output, speaker-review handoffs, and scheduled folder scanning."
    critical: true
    authoritative_sources:
      - "transcriptforge/cli.py"
      - "transcriptforge/__main__.py"
      - "transcriptforge/scheduler.py"
      - "Install_TranscriptForgeTask.ps1"
      - "Remove_TranscriptForgeTask.ps1"
    supporting_sources:
      - "README.md"
      - "tests/test_cli.py"
    dependencies:
      - "Python Launcher on Windows"
      - "Windows Task Scheduler for the optional recurring scan"
    constraints:
      - "Scheduled scans use the local recording folder and local recording history."
      - "The scan presents a user choice before transcription, ignoring, or deleting a recording."

  - name: "Local settings and portable configuration"
    path: "transcriptforge/settings.py"
    purpose: "Persists application preferences and histories locally and imports or exports portable configuration packages."
    critical: true
    authoritative_sources:
      - "transcriptforge/settings.py"
      - "transcriptforge/configuration.py"
    supporting_sources:
      - "README.md"
      - "DOC/INSTALLATION.md"
      - "tests/test_settings.py"
      - "tests/test_configuration.py"
    dependencies:
      - "Windows LOCALAPPDATA when available"
      - "JSON settings stores and ZIP-based .tfconfig packages"
    constraints:
      - "Configuration packages can contain biometric speaker embeddings and must be handled as sensitive data."
      - "Machine-specific recording and output paths, histories, models, audio, and transcripts are excluded from portable configuration packages."

  - name: "Documentation and verification"
    path: "DOC/"
    purpose: "Explains user workflows, installation, current speaker-recognition behavior, proposed feasibility work, and project history."
    critical: false
    authoritative_sources:
      - "README.md"
      - "DOC/INSTALLATION.md"
      - "DOC/SPEAKER_RECOGNITION_CURRENT_STATE.md"
      - "AGENTS.md"
    supporting_sources:
      - "DOC/SPEAKER_RECOGNITION_FEASIBILITY_PLAN.md"
      - "DOC/Audio_Transcriber_Project_Proposal.md"
      - "tests/"
    dependencies:
      - "Implementation and tests for current behavior"
    constraints:
      - "The feasibility plan is prospective; do not treat its proposed work as implemented."

system_or_information_flow:
  overview: "The user selects local media and options. TranscriptForge decodes audio locally, optionally analyzes and reviews speakers, transcribes with a cached local Whisper model, and writes Markdown output."
  inputs:
    - "Supported local WAV, MP3, M4A, AAC, MP4, MOV, or MKV media."
    - "User-selected model, language, output options, and optional speaker preferences."
    - "Optional appointments and invitees read from the local Outlook Classic default calendar."
  processing_or_workflow:
    - "transcriptforge/media.py invokes the FFmpeg executable supplied by imageio-ffmpeg to create temporary mono 16 kHz PCM audio."
    - "transcriptforge/audio.py reads samples for local speech and speaker processing."
    - "transcriptforge/speakers.py optionally analyzes voice intervals and uses reviewed identities and local profiles."
    - "transcriptforge/transcription.py sends audio samples to the cached local Whisper model and retries suspect ranges."
    - "transcriptforge/output.py renders and atomically writes the Markdown transcript."
  outputs:
    - "A timestamped Markdown transcript in the selected output location."
    - "Optional speaker-review JSON and temporary review clips when human review is needed."
    - "Local JSON settings, history, rejection records, and speaker profiles."

