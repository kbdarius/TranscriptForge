workflows:
  - name: "Manual GUI transcription"
    trigger: "The user launches the application directly."
    inputs:
      - "A supported local media file."
      - "A cached Whisper model and optional user settings."
    steps:
      - "Launch with Run_TranscriptForge.bat or py -3 -m transcriptforge."
      - "Select the media, output location, model, and optional speaker settings."
      - "If speaker identification is enabled, review suggested and unresolved voices before Whisper transcription."
      - "Transcribe locally and save the rendered Markdown output."
    outputs:
      - "A Markdown transcript and updated local histories or profiles as applicable."
    failure_handling:
      - "Whisper transcription requires an already cached model; use the GUI Download model action or the CLI model download command."
      - "Use Setup_TranscriptForge.bat to install or verify required packages and model files."

  - name: "CLI transcription and speaker review"
    trigger: "A user or automation invokes transcriptforge.cli."
    inputs:
      - "A supported media path and CLI options."
      - "Optional speaker-review JSON from an earlier run."
    steps:
      - "Run py -3 -m transcriptforge.cli transcribe with the requested options."
      - "With --speakers, the command can return exit code 2 and write a speaker-review JSON file before transcription."
      - "Edit review names and rerun with --speaker-review; unresolved voices can require another review pass."
      - "Use --accept-suggestions only when bypassing the human review checkpoint is intentional."
    outputs:
      - "A Markdown transcript, JSON events when requested, or a speaker-review JSON handoff."
    failure_handling:
      - "Invalid or unsupported input, existing output without --force, and uncached models are reported as errors."

  - name: "Scheduled recording scan"
    trigger: "The optional Windows Scheduled Task runs at its configured interval."
    inputs:
      - "A user-configured local recording folder."
      - "Local recording history and supported media files."
    steps:
      - "Install or remove the task with Install_TranscriptForgeTask.ps1 or Remove_TranscriptForgeTask.ps1."
      - "transcriptforge/scheduler.py selects an eligible recording older than its minimum age and launches the GUI."
      - "The user can transcribe, ignore, or delete the selected recording; history supports later requeue of ignored or pending recordings."
    outputs:
      - "A GUI transcription job and an updated local recording-history ledger."
    failure_handling:
      - "The setup script reports missing Python or task-registration errors."
      - "Deleting a recording is a user-confirmed file operation and cannot be undone by TranscriptForge."

  - name: "Meeting-aware speaker review"
    trigger: "The user selects an Outlook meeting in the main window or scheduled-recording prompt."
    inputs:
      - "The recording date from a supported filename timestamp when available, otherwise the file modified time."
      - "Organizer and attendee names from the selected local Outlook Classic appointment."
      - "Existing local speaker profiles."
    steps:
      - "Leave the explicit no-meeting option selected to preserve the current preference-driven workflow."
      - "When a meeting is selected, use its roster to shortlist saved profiles for that recording."
      - "Ask for confirmation when an Outlook spelling resembles a saved profile or expected-speaker name; confirmed aliases use Outlook spelling."
      - "Apply the attendee count only as a soft review limit; keep extra distinct voice groups available for review."
    outputs:
      - "Meeting-specific speaker suggestions and user-confirmed profile/name decisions."
    failure_handling:
      - "Unmatched guests and uncertain acoustic groups remain reviewable rather than being forced to a roster name."
      - "Outlook integration is optional and depends on Outlook Classic and pywin32 on the local PC."

  - name: "Portable configuration transfer"
    trigger: "The user selects Export configuration or Import configuration."
    inputs:
      - "Preferences, filename templates, local profile data, and removed-sample decisions."
      - "An optional .tfconfig package."
    steps:
      - "Export or import through transcriptforge/configuration.py."
      - "Merge imported speaker profile data with destination profiles."
    outputs:
      - "A ZIP-based .tfconfig package or updated local JSON settings and profiles."
    failure_handling:
      - "Only supported package format/version data is accepted."
      - "Treat packages as sensitive because they may contain biometric embeddings and names."

